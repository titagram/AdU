<VirtualHost *:80>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        AllowOverride None
        Require all granted
        # I servizi interni non hanno un front controller: ogni percorso sconosciuto va
        # comunque a index.php, che smista da sé.
        FallbackResource /index.php
    </Directory>
</VirtualHost>
