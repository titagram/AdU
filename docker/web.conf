server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Guasto controllato del canale di collaudo. Il documento conserva lo stato HTTP 503.
    location = /assistenza {
        error_page 503 /assistenza-non-disponibile.html;
        return 503;
    }

    location = /assistenza-non-disponibile.html {
        internal;
    }

    # La SPA è a pagina singola: ogni percorso sconosciuto torna index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nessun file nascosto deve essere servito: è il difetto che in M5 il corso
    # reintrodurrà di proposito (L19, esposizione di `.git` sull'API).
    location ~ /\. {
        return 404;
    }

    add_header X-Content-Type-Options nosniff;
    add_header Cache-Control "no-store" always;
}
